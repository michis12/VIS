<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#000000" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <!-- "black", not "black-translucent": the translucent bar makes iOS shrink the
         viewport, which left a black strip under the tab bar -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="VIS" />
    <!-- icon file names carry a version so iOS cannot keep showing a cached old icon -->
    <link rel="icon" type="image/png" href="./favicon-64-v4.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon-v4.png" />
    <title>VIS</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
