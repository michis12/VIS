<!doctype html>
<!-- Renders the VIS app icon on a canvas and posts PNGs to scripts/icon/save_server.py -->
<html>
<head>
<meta charset="utf-8" />
<title>VIS icon</title>
<style>
  body { margin: 0; background: #222; display: flex; gap: 24px; padding: 24px; align-items: flex-start; font: 13px system-ui; color: #aaa; }
  canvas { width: 384px; height: 384px; border-radius: 86px; box-shadow: 0 20px 60px rgba(0,0,0,.6); }
</style>
</head>
<body>
<canvas id="c" width="1024" height="1024"></canvas>
<div id="log">rendering…</div>
<script>
const S = 1024
const c = document.getElementById('c')
const ctx = c.getContext('2d')

function blobs(g, blur) {
  g.save()
  g.filter = `blur(${blur}px)`
  const spots = [
    { x: 280, y: 250, r: 230, col: 'rgba(199,199,204,1)' },
    { x: 780, y: 760, r: 260, col: 'rgba(142,142,147,1)' },
    { x: 830, y: 210, r: 120, col: 'rgba(242,242,247,0.7)' },
    { x: 200, y: 860, r: 140, col: 'rgba(99,99,102,1)' },
  ]
  for (const s of spots) {
    g.fillStyle = s.col
    g.beginPath(); g.arc(s.x, s.y, s.r, 0, Math.PI * 2); g.fill()
  }
  g.restore()
}

// 1. black base
ctx.fillStyle = '#000'
ctx.fillRect(0, 0, S, S)
// 2. soft gray light behind the glass
blobs(ctx, 90)
// 3. frosted glass sheet across the whole icon: heavier blur + dark tint
const glass = document.createElement('canvas')
glass.width = glass.height = S
const gg = glass.getContext('2d')
gg.fillStyle = '#000'; gg.fillRect(0, 0, S, S)
blobs(gg, 190)
ctx.globalAlpha = 0.85
ctx.drawImage(glass, 0, 0)
ctx.globalAlpha = 1
ctx.fillStyle = 'rgba(0,0,0,0.30)'
ctx.fillRect(0, 0, S, S)
// subtle top sheen like light on glass
const sheen = ctx.createLinearGradient(0, 0, 0, S)
sheen.addColorStop(0, 'rgba(255,255,255,0.10)')
sheen.addColorStop(0.45, 'rgba(255,255,255,0.0)')
ctx.fillStyle = sheen
ctx.fillRect(0, 0, S, S)
// 4. fine grain so the blur reads as material, not a gradient
const img = ctx.getImageData(0, 0, S, S)
let seed = 7
const rnd = () => ((seed = (seed * 16807) % 2147483647) / 2147483647)
for (let i = 0; i < img.data.length; i += 4) {
  const n = (rnd() - 0.5) * 7
  img.data[i] += n; img.data[i + 1] += n; img.data[i + 2] += n
}
ctx.putImageData(img, 0, 0)
// 5. VIS wordmark
// 5. mark: a chrome V with a barbell through it (in front of the left arm, behind the right one), inner plates cut from emerald (v4)
const chromeV = (y0, y1) => {
  const g = ctx.createLinearGradient(0, y0, 0, y1)
  g.addColorStop(0, '#ffffff'); g.addColorStop(0.5, '#e5e5ea'); g.addColorStop(1, '#9a9aa0')
  return g
}
const shadow = (blur, dy, a = 0.5) => { ctx.shadowColor = `rgba(0,0,0,${a})`; ctx.shadowBlur = blur; ctx.shadowOffsetY = dy }
const rr = (x, y, w, h, r) => { ctx.beginPath(); ctx.roundRect(x, y, w, h, r) }

// the barbell runs through the V: in front of the left arm, behind the right one
const barY = 520
const drawBar = (x0, x1) => {
  ctx.save()
  shadow(30, 10, 0.55)
  const bar = ctx.createLinearGradient(0, barY - 20, 0, barY + 20)
  bar.addColorStop(0, '#f2f2f7'); bar.addColorStop(0.5, '#aeaeb2'); bar.addColorStop(1, '#636366')
  ctx.fillStyle = bar
  rr(x0, barY - 19, x1 - x0, 38, 10); ctx.fill()
  ctx.restore()
}

// the V: two slanted arms meeting in a sharp point
const vTop = 250, vBot = 800, vHalf = 290, arm = 150
ctx.save()
shadow(50, 14)
ctx.fillStyle = chromeV(vTop, vBot)
ctx.beginPath()
ctx.moveTo(S / 2 - vHalf, vTop)
ctx.lineTo(S / 2 - vHalf + arm, vTop)
ctx.lineTo(S / 2, vBot - 190)
ctx.lineTo(S / 2 + vHalf - arm, vTop)
ctx.lineTo(S / 2 + vHalf, vTop)
ctx.lineTo(S / 2 + 62, vBot)
ctx.lineTo(S / 2 - 62, vBot)
ctx.closePath()
ctx.fill()
ctx.restore()
// light edge on the left arm, shade on the right one: reads as polished metal
ctx.save()
ctx.globalAlpha = 0.35
ctx.fillStyle = '#ffffff'
ctx.beginPath()
ctx.moveTo(S / 2 - vHalf, vTop); ctx.lineTo(S / 2 - vHalf + 26, vTop); ctx.lineTo(S / 2 - 40, vBot); ctx.lineTo(S / 2 - 62, vBot); ctx.closePath(); ctx.fill()
ctx.globalAlpha = 0.18
ctx.fillStyle = '#000'
ctx.beginPath()
ctx.moveTo(S / 2 + vHalf, vTop); ctx.lineTo(S / 2 + vHalf - 30, vTop); ctx.lineTo(S / 2 + 36, vBot); ctx.lineTo(S / 2 + 62, vBot); ctx.closePath(); ctx.fill()
ctx.restore()

// the bar in one piece after the V, with only the right arm cut out: so it lies
// in front of the left arm and behind the right one, and the V's shadow never
// darkens part of it (that left a visible colour step before)
ctx.save()
ctx.beginPath()
ctx.rect(0, 0, S, S)
ctx.moveTo(S / 2 + vHalf, vTop)
ctx.lineTo(S / 2 + vHalf - arm, vTop)
ctx.lineTo(S / 2, vBot - 190)
ctx.lineTo(S / 2, vBot)
ctx.lineTo(S / 2 + 62, vBot)
ctx.closePath()
ctx.clip('evenodd')
drawBar(118, S - 118)
ctx.restore()

const plate = (cx, w, h, fill, edge) => {
  ctx.save()
  shadow(26, 8, 0.55)
  ctx.fillStyle = fill
  rr(cx - w / 2, barY - h / 2, w, h, Math.min(18, w / 3)); ctx.fill()
  ctx.restore()
  // thin highlight down the plate's left edge
  ctx.save()
  ctx.fillStyle = edge
  rr(cx - w / 2 + 6, barY - h / 2 + 14, 6, h - 28, 3); ctx.fill()
  ctx.restore()
}
const chromePlate = () => {
  const g = ctx.createLinearGradient(0, barY - 190, 0, barY + 190)
  g.addColorStop(0, '#ffffff'); g.addColorStop(0.45, '#d1d1d6'); g.addColorStop(1, '#7c7c82')
  return g
}
const emeraldPlate = () => {
  const g = ctx.createLinearGradient(0, barY - 140, 0, barY + 140)
  g.addColorStop(0, '#c4ffe6'); g.addColorStop(0.35, '#4fe3a6'); g.addColorStop(0.7, '#12a06a'); g.addColorStop(1, '#0b6e48')
  return g
}
for (const side of [-1, 1]) {
  plate(S / 2 + side * 330, 56, 300, chromePlate(), 'rgba(255,255,255,0.55)') // big outer plate
  plate(S / 2 + side * 272, 44, 220, emeraldPlate(), 'rgba(220,255,240,0.6)') // emerald inner plate
  plate(S / 2 + side * 380, 26, 120, chromePlate(), 'rgba(255,255,255,0.5)') // collar
}

async function save(name, size) {
  const out = document.createElement('canvas')
  out.width = out.height = size
  const o = out.getContext('2d')
  o.imageSmoothingQuality = 'high'
  o.drawImage(c, 0, 0, size, size)
  const blob = await new Promise((r) => out.toBlob(r, 'image/png'))
  const res = await fetch('http://127.0.0.1:8765/' + name, { method: 'POST', body: blob })
  return name + ': ' + res.status
}

window.exportIcons = async () => {
  const r = []
  // bump V (and the names in index.html / vite.config.ts) whenever the icon changes,
  // otherwise iPhones keep showing the cached old icon
  const V = 'v4'
  for (const [n, s] of [['icon-1024.png', 1024], [`icon-512-${V}.png`, 512], [`icon-192-${V}.png`, 192], [`apple-touch-icon-${V}.png`, 180], [`favicon-64-${V}.png`, 64]]) r.push(await save(n, s))
  document.getElementById('log').textContent = r.join('\n')
  return r
}
document.getElementById('log').textContent = 'ready'
</script>
</body>
</html>
