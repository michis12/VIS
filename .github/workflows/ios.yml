name: iOS build + simulator check

# Only for the "ios" branch – main / the live PWA deploy are not affected.
on:
  push:
    branches: [ios]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run app

      - name: Select newest Xcode
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)"
          xcodebuild -version

      - name: xcodebuild (simulator, unsigned)
        working-directory: ios/App
        run: |
          set -o pipefail
          xcodebuild -project App.xcodeproj -scheme App -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO build 2>&1 | tee build.log \
            | grep -E "error:|warning: .*(Root|Native|Rest)|\*\* BUILD" || true
          grep -q "BUILD SUCCEEDED" build.log

      - name: xcodebuild (device, unsigned – checks the widget extension for iphoneos)
        working-directory: ios/App
        run: |
          set -o pipefail
          xcodebuild -project App.xcodeproj -scheme App -configuration Debug \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build-device CODE_SIGNING_ALLOWED=NO build 2>&1 | tee build-device.log \
            | grep -E "error:|\*\* BUILD" || true
          grep -q "BUILD SUCCEEDED" build-device.log

      - name: Run in simulator
        working-directory: ios/App
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json,sys
          d=json.load(sys.stdin)["devices"]
          c=[(r,x) for r,l in d.items() if "iOS-26" in r for x in l if "iPhone" in x["name"]]
          c.sort(key=lambda t:(t[0], "Pro" in t[1]["name"] and "Max" not in t[1]["name"]))
          print(c[-1][1]["udid"]); print(c[-1][1]["name"], c[-1][0], file=sys.stderr)')
          xcrun simctl boot "$UDID"; xcrun simctl bootstatus "$UDID" -b
          APP=build/Build/Products/Debug-iphonesimulator/App.app
          ls "$APP/PlugIns"
          xcrun simctl install "$UDID" "$APP"
          mkdir -p shots
          xcrun simctl spawn "$UDID" log stream --level debug --predicate 'process == "App"' > shots/app.log 2>&1 &
          xcrun simctl launch "$UDID" com.vis.fitness -VISDemoRest 300
          sleep 20
          xcrun simctl io "$UDID" screenshot shots/1-app.png
          xcrun simctl launch "$UDID" com.apple.Preferences
          sleep 6
          xcrun simctl io "$UDID" screenshot shots/2-island.png
          kill %1 || true
          echo "--- app log (filtered) ---"
          grep -E "⚡️|RestActivity|NativeTabs|error|Error" shots/app.log | head -80 || true
          for f in shots/*.png; do
            sips -s format jpeg -s formatOptions 55 -Z 1000 "$f" --out "${f%.png}.jpg" >/dev/null
            echo "=== B64 ${f%.png}.jpg ==="; base64 -i "${f%.png}.jpg" | tr -d '\n'; echo; echo "=== END ==="
          done

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-check
          path: |
            ios/App/build.log
            ios/App/build-device.log
            ios/App/shots
