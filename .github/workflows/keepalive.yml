name: Keep Supabase awake

# Free-plan Supabase projects pause after 7 days without activity.
# This calls the harmless public.ping() function every 3 days.
on:
  schedule:
    - cron: '17 6 */3 * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ping database
        run: |
          set -a; . ./.env; set +a
          for i in 1 2 3; do
            code=$(curl -s -o /tmp/out -w '%{http_code}' -X POST \
              "$VITE_SUPABASE_URL/rest/v1/rpc/ping" \
              -H "apikey: $VITE_SUPABASE_KEY" -H 'Content-Type: application/json' -d '{}')
            echo "attempt $i: HTTP $code, body $(cat /tmp/out)"
            [ "$code" = 200 ] && exit 0
            sleep 30
          done
          echo "::error::Supabase did not answer - it may be paused. Restore it in the Supabase dashboard."
          exit 1
